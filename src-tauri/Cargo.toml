[package]
name = "droid-setup"
version = "0.1.0"
description = "Guided Android USB connection for Windows and Linux"
authors = ["fcode09"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "droid_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
sha2 = "0.10"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["process", "time", "sync", "rt", "macros"] }
