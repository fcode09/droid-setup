<div class="shell" [class.collapsed]="p.sidebarCollapsed()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a class="brand" routerLink="/connect" aria-label="Droid Setup">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M10 8h15l7 12-7 12H10l7-12z" />
          <path d="M10 8 3 20l7 12M17 20h15" />
        </svg>
        <span class="brand-name">Droid<span class="brand-light">Setup</span></span>
      </a>
      <button
        class="sidebar-toggle"
        (click)="p.toggleSidebar()"
        [attr.aria-label]="p.t(p.sidebarCollapsed() ? 'expandSidebar' : 'collapseSidebar')"
        [attr.title]="p.t(p.sidebarCollapsed() ? 'expandSidebar' : 'collapseSidebar')"
        [attr.aria-expanded]="!p.sidebarCollapsed()"
        aria-controls="primary-navigation"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M9 4v16" />
          @if (p.sidebarCollapsed()) {
            <path d="m13 9 3 3-3 3" />
          } @else {
            <path d="m16 9-3 3 3 3" />
          }
        </svg>
      </button>
    </div>
    <div class="nav-label">{{ p.t('navigation') }}</div>
    <nav id="primary-navigation" [attr.aria-label]="p.t('workspace')">
      <a
        [attr.aria-label]="p.t('connect')"
        [attr.title]="p.t('connect')"
        routerLink="/connect"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="2" width="10" height="20" rx="2" />
          <path d="M10 5h4M11 19h2" /></svg
        ><span class="nav-text">{{ p.t('connect') }}</span>
      </a>
      <a
        [attr.aria-label]="p.t('settings')"
        [attr.title]="p.t('settings')"
        routerLink="/settings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
          <circle cx="8" cy="6" r="2" />
          <circle cx="16" cy="12" r="2" />
          <circle cx="10" cy="18" r="2" /></svg
        ><span class="nav-text">{{ p.t('settings') }}</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="local-label">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 4 6v6c0 4 8 9 8 9s8-5 8-9V6zM8 12l3 3 5-6" /></svg
        ><span>{{ p.t('localWorkspace') }}</span>
      </div>
      <div class="edition">{{ p.t('desktopEdition') }}</div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">
        <span>Droid Setup</span
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg
        ><span class="current">{{ p.t(currentView()) }}</span>
      </div>
      <div class="language-switch">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18" /></svg
        ><app-select
          [compact]="true"
          [label]="p.t('language')"
          [value]="p.language()"
          [options]="languages"
          (valueChange)="p.setLanguage($event)"
        />
      </div>
    </header>
    <main id="main-content"><router-outlet /></main>
    <footer>
      <span class="footer-status"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 4 6v6c0 4 8 9 8 9s8-5 8-9V6zM8 12l3 3 5-6" /></svg
        >{{ p.t('readOnly') }}</span
      ><span class="footer-detail">{{ p.t('noChanges') }}</span
      ><span class="footer-version">v0.1.0</span>
    </footer>
  </div>
</div>
