name: Build desktop artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Linux package in Docker
        run: bash scripts/docker-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: droid-setup-linux-x64
          path: artifacts/linux-*/
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Prepare pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Prepare bundled ADB and verify frontend
        run: |
          npm run tools:prepare
          npm test
          npm run build
      - name: Test native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run desktop:build -- --config src-tauri/tauri.windows.conf.json -- --locked
      - name: Collect checksums and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/windows/
          Copy-Item src-tauri/resources/adb/NOTICE.txt artifacts/windows/ADB-NOTICE.txt
          Copy-Item scripts/adb-manifest.json artifacts/windows/adb-manifest.json
          Get-ChildItem artifacts/windows/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/windows/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: droid-setup-windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
